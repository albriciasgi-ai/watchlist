<!DOCTYPE html>
<html>
<head>
    <title>Test Debug Status</title>
</head>
<body>
    <h1>Debug Status Test</h1>
    <button onclick="enableDebug()">Enable Debug Mode</button>
    <button onclick="testLogs()">Test Logs</button>
    <div id="status"></div>

    <script>
        function checkDebugStatus() {
            const debugMode = localStorage.getItem('DEBUG_MODE');
            const nodeEnv = 'development'; // Frontend is in dev mode
            document.getElementById('status').innerHTML = `
                <h2>Current Status:</h2>
                <p>localStorage DEBUG_MODE: ${debugMode || 'not set'}</p>
                <p>NODE_ENV: ${nodeEnv}</p>
                <p>Should be logging: ${debugMode !== 'false' && nodeEnv === 'development' ? 'YES' : 'NO'}</p>
            `;
        }

        function enableDebug() {
            localStorage.setItem('DEBUG_MODE', 'true');
            alert('Debug mode enabled. Refresh the app.');
            checkDebugStatus();
        }

        function testLogs() {
            console.log('Regular console.log test');
            console.debug('Regular console.debug test');
            checkDebugStatus();
        }

        checkDebugStatus();
    </script>
</body>
</html>
