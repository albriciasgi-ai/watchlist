<!DOCTYPE html>
<html>
<head>
    <title>Test Charts Loading</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #2a4a2a; color: #4f4; }
        .error { background: #4a2a2a; color: #f44; }
        .info { background: #2a2a4a; color: #88f; }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        pre {
            background: #111;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Test de Carga de Gráficos</h1>

    <div id="status"></div>

    <h2>Acciones de Prueba:</h2>
    <button onclick="checkBackend()">1. Verificar Backend</button>
    <button onclick="testHistoricalData()">2. Probar Datos Históricos</button>
    <button onclick="checkConsoleLog()">3. Verificar Console Logs</button>
    <button onclick="openApp()">4. Abrir Aplicación</button>

    <h2>Logs:</h2>
    <pre id="logs"></pre>

    <script>
        const API_URL = 'http://localhost:8000';
        const APP_URL = 'http://localhost:5176';

        function log(message, type = 'info') {
            const status = document.getElementById('status');
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            status.appendChild(div);

            // También agregar al log
            logs.textContent += `[${type.toUpperCase()}] ${message}\n`;
        }

        async function checkBackend() {
            log('Verificando backend...', 'info');
            try {
                const response = await fetch(`${API_URL}/api/status`);
                if (response.ok) {
                    const data = await response.json();
                    log('✅ Backend funcionando correctamente', 'success');
                    log(`Cache activa: ${data.cache_count} archivos`, 'info');
                } else {
                    log('❌ Error en backend: ' + response.status, 'error');
                }
            } catch (error) {
                log('❌ No se puede conectar al backend: ' + error.message, 'error');
            }
        }

        async function testHistoricalData() {
            log('Probando carga de datos históricos...', 'info');
            try {
                const response = await fetch(`${API_URL}/api/historical/BTCUSDT?interval=15&days=1`);
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Datos históricos cargados: ${data.candles.length} velas`, 'success');
                    log(`Última vela: ${new Date(data.candles[data.candles.length - 1].time).toLocaleString()}`, 'info');

                    // Verificar estructura de datos
                    if (data.candles.length > 0) {
                        const candle = data.candles[0];
                        if (candle.open && candle.high && candle.low && candle.close && candle.volume) {
                            log('✅ Estructura de datos correcta', 'success');
                        } else {
                            log('❌ Estructura de vela incorrecta', 'error');
                        }
                    }
                } else {
                    log('❌ Error cargando histórico: ' + response.status, 'error');
                }
            } catch (error) {
                log('❌ Error de conexión: ' + error.message, 'error');
            }
        }

        function checkConsoleLog() {
            log('Verificando console.log en MiniChart...', 'info');

            // Inyectar script para capturar logs
            const script = `
                // Los console.log agregados en MiniChart deberían aparecer aquí:
                // - "[BTCUSDT] Solicitando histórico: X días @ 15"
                // - "[BTCUSDT] ✅ Histórico cargado: X velas confirmadas"
                // - "[BTCUSDT] 🚀 Componente montado, iniciando..."

                // También verificar que NO aparezcan:
                // - "Creando Fibonacci porque está habilitado" (si está deshabilitado)
                // - "Creando Continuation Patterns porque está habilitado" (si está deshabilitado)

                console.log('🔍 Abre la consola del navegador (F12) y verifica estos mensajes');
            `;

            log('Abre la consola del navegador (F12) y busca:', 'info');
            log('✓ "[BTCUSDT] Solicitando histórico..."', 'info');
            log('✓ "[BTCUSDT] ✅ Histórico cargado..."', 'info');
            log('✓ "[BTCUSDT] 🚀 Componente montado..."', 'info');
            log('✗ NO debe aparecer "Creando Fibonacci" si está deshabilitado', 'info');
            log('✗ NO debe aparecer "Creando Continuation Patterns" si está deshabilitado', 'info');
        }

        function openApp() {
            log(`Abriendo aplicación en ${APP_URL}...`, 'info');
            window.open(APP_URL, '_blank');
            log('Verifica en la aplicación:', 'info');
            log('1. Los gráficos deben mostrar velas', 'info');
            log('2. No deben cargar indicadores deshabilitados', 'info');
            log('3. La consola no debe mostrar errores', 'info');
        }

        // Test inicial
        window.onload = () => {
            log('🚀 Test iniciado', 'success');
            checkBackend();
        };
    </script>
</body>
</html>
